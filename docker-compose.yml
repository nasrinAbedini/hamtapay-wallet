services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wallet
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d wallet"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes: ["wallet_pg:/var/lib/postgresql/data"]
  simulator:
    image: hamtapay/t103-simulator:1.0
    ports: ["8080:8080"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SIM_CHAOS: ${SIM_CHAOS:-default}
      SIM_TIME_SCALE: ${SIM_TIME_SCALE:-1}
      SIM_PUBLIC_URL: ${SIMULATOR_PUBLIC_URL:-http://simulator:8080}
      PAYOUT_WEBHOOK_URL: ${PAYOUT_WEBHOOK_URL:-http://app:3000/webhooks/payout}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-hamtapay-sim-secret}
      SIM_ADMIN_KEY: ${SIM_ADMIN_KEY:-local-simulator-admin}
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://wallet:wallet@postgres:5432/wallet
      SIMULATOR_BASE_URL: http://simulator:8080
      PSP_BASE_URL: http://simulator:8080
      PAYOUT_BASE_URL: http://simulator:8080
      PSP_CALLBACK_URL: http://app:3000/payments/psp/callback
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-hamtapay-sim-secret}
    ports: ["3000:3000"]
    depends_on:
      postgres: { condition: service_healthy }
      simulator: { condition: service_started }
volumes:
  wallet_pg:
